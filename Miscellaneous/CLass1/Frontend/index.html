<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class1</title>
</head>

<body>
    <h3>GET request form</h3>
    <form method="get" action="http://localhost:3000/register">
        <input placeholder="Enter user name" name="user" type="text" />
        <input placeholder="Enter password" name="password" type="password" />
        <button type="button">Submit!</button>
    </form>
    <hr>
    <h3>POST request form</h3>
    <form method="post" action="http://localhost:3000/register">
        <input placeholder="Enter user name" name="user" type="text" />
        <input placeholder="Enter password" name="password" type="password" />
        <button type="button">Submit!</button>
    </form>
</body>

</html>
